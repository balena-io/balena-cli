services:
  service1:
    build:
      context: ./service1
    extends:
      file: base.yml
      service: base
    annotations:
      com.example.foo: bar
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "echo", "ok"]
      start_period: 30s
    ipc: shareable
    label_file:
      - labels.txt
    pids_limit: 100
    read_only: true
    runtime: runc
    networks:
      custom_network:
        aliases:
          - alias1
        ipv4_address: 172.16.0.10
  service2:
    build:
      context: ./service2
      dockerfile: Dockerfile-alt
    network_mode: "service:service1"

networks:
  custom_network:
    ipam:
      config:
        - subnet: 172.16.0.0/24
